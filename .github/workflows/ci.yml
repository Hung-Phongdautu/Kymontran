name: Kiểm tra trang

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kiểm thử mô-đun lập trận, bảng tra data/ và máy chủ trung gian
        run: node --test test/*.test.mjs
      - name: index.html khớp với nguồn và mọi liên kết nội bộ hợp lệ
        run: python3 test/check_site.py
