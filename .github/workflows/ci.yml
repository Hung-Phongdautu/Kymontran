name: Kiểm tra trang

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: index.html khớp với nguồn và mọi liên kết nội bộ hợp lệ
        run: python3 tests/check_site.py
      - name: Bộ máy lập trận khớp các ví dụ của quy trình 12 bước
        run: node tests/test_kymon.mjs
      - name: Máy chủ trung gian xử lý đúng (không gọi OpenAI thật)
        run: node tests/test_worker.mjs
