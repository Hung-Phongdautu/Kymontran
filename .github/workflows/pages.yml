# Đưa trang lên GitHub Pages. Chỉ chạy khi bấm tay (Actions → Run workflow),
# sau khi đã bật Pages với nguồn "GitHub Actions" trong Settings của kho.
name: Đưa trang lên GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dựng và kiểm tra trang
        run: |
          python3 build.py
          python3 tests/check_site.py
          mkdir _site
          cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
