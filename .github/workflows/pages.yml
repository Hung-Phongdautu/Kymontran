# Đưa trang lên GitHub Pages — chỉ chạy khi bấm tay (Actions → Run workflow), để kho giữ
# riêng tư và trang chỉ lên mạng khi có nhu cầu. Cần bật Pages với nguồn "GitHub Actions"
# trong Settings của kho trước; kho riêng tư cần gói GitHub có hỗ trợ Pages — xem KHOI-CHAY.md.
name: Đưa trang lên GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dựng và kiểm tra trang
        run: |
          python3 build.py --site _site
          node --test test/*.test.mjs
          python3 test/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
